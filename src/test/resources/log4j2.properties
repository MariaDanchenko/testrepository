status = warn
name = PropertiesConfig

appenders = console

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

loggers = LoginTestLogger, CartTestLogger, CheckoutTestLogger

logger.LoginTestLogger.name = testcode.logger.LoginTest
logger.LoginTestLogger.level = info
logger.LoginTestLogger.additivity = false
logger.LoginTestLogger.appenderRefs = console
logger.LoginTestLogger.appenderRef.console.ref = Console

logger.CartTestLogger.name = testcode.logger.CartTest
logger.CartTestLogger.level = info
logger.CartTestLogger.additivity = false
logger.CartTestLogger.appenderRefs = console
logger.CartTestLogger.appenderRef.console.ref = Console

logger.CheckoutTestLogger.name = testcode.logger.CheckoutTest
logger.CheckoutTestLogger.level = info
logger.CheckoutTestLogger.additivity = false
logger.CheckoutTestLogger.appenderRefs = console
logger.CheckoutTestLogger.appenderRef.console.ref = Console

rootLogger.level = info
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console