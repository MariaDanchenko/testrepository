plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.36.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.1.0'
    testImplementation 'org.testng:testng:7.9.0'
}

test {
    useTestNG()
}